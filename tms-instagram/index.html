<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMS Instagram avatar</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 48px 24px 72px;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #16233F;
    color: #F4EFE3;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { margin: 0 0 48px; color: #5EDCC0; }
  h2 { font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;
       color: #8fa0bd; margin: 48px 0 20px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; }
  figure { margin: 0; text-align: center; }
  figure img { display: block; border-radius: 50%; }
  figcaption { margin-top: 10px; font-size: 12px; color: #8fa0bd; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TMS Instagram avatar</h1>
  <p class="sub">Head, figure-eight coil, pulse waves. Circle-cropped the way Instagram shows it.</p>

  <h2>Displayed sizes</h2>
  <div class="row">
    <figure>
      <img src="tms-avatar-320.png" width="150" height="150" alt="Avatar at profile size">
      <figcaption>150 px &mdash; profile header</figcaption>
    </figure>
    <figure>
      <img src="tms-avatar-320.png" width="56" height="56" alt="Avatar at post header size">
      <figcaption>56 px &mdash; post header</figcaption>
    </figure>
    <figure>
      <img src="tms-avatar-320.png" width="32" height="32" alt="Avatar at comment size">
      <figcaption>32 px &mdash; comments</figcaption>
    </figure>
  </div>

  <h2>Colourways</h2>
  <div class="row">
    <figure>
      <img src="tms-avatar-1080.png" width="160" height="160" alt="Indigo ground, mint mark">
      <figcaption>Primary</figcaption>
    </figure>
    <figure>
      <img src="tms-avatar-light-1080.png" width="160" height="160" alt="Cream ground, indigo mark">
      <figcaption>Light</figcaption>
    </figure>
    <figure>
      <img src="tms-avatar-mint-1080.png" width="160" height="160" alt="Mint ground, indigo mark">
      <figcaption>Accent</figcaption>
    </figure>
  </div>
</div>
</body>
</html>
